# Plugin version (the OSGi bundle version gets a timestamp qualifier appended)
version=1.0.1

# Archi installation used to compile against (its plugins/ folder is put on the classpath).
# Leave empty to use .archi-sdk/Archi, downloaded by scripts/fetch-archi.sh.
# Examples:
#   archiHome=/Applications/Archi.app/Contents/Eclipse
#   archiHome=C:/Program Files/Archi
# Can also be set with the ARCHI_HOME environment variable or -ParchiHome=...
archiHome=

org.gradle.console=plain
